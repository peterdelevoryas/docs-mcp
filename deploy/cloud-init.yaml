#cloud-config
# First-boot setup for a docs-mcp VM. The binary itself is built and
# installed by deploy.sh; documents are uploaded with upload.sh. Nothing
# here is irreplaceable (the database is rebuilt from the uploaded files),
# so there is no volume and no backup.
package_update: true
package_upgrade: true
packages:
  - build-essential
  - pkg-config
  - rsync
  - ufw
  - sqlite3
  - poppler-utils
  - mupdf-tools
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - gnupg
users:
  - default
  - name: docs-mcp
    system: true
    shell: /usr/sbin/nologin
    no_create_home: true
runcmd:
  # Caddy from its official apt repo.
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update && apt-get install -y caddy
  # Rust toolchain for building on the box.
  - curl -sSf https://sh.rustup.rs | HOME=/root sh -s -- -y --profile minimal
  - ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable
  - install -d -o root -g docs-mcp -m 0750 /etc/docs-mcp
  - install -d -o docs-mcp -g docs-mcp -m 0700 /var/lib/docs-mcp /var/lib/docs-mcp/docs
