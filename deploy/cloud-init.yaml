#cloud-config
# First-boot setup for a docs-mcp VM. The binary itself is built and
# installed by deploy.sh; documents are uploaded with upload.sh. Nothing
# here is irreplaceable (the database is rebuilt from the uploaded files),
# so there is no volume and no backup.
package_update: true
package_upgrade: true
packages:
  - build-essential
  - pkg-config
  - rsync
  - ufw
  - sqlite3
  - poppler-utils
  - mupdf-tools
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - curl
  - gnupg
users:
  - default
  - name: docs-mcp
    system: true
    shell: /usr/sbin/nologin
    no_create_home: true
bootcmd:
  # The server has no public address; it sits behind the edge, which proxies
  # HTTPS to it. Hetzner gives a private-only server no default route and no
  # DNS: send its traffic through the network gateway to the edge's NAT.
  - ip route replace default via 10.0.0.1
  - mkdir -p /etc/systemd/resolved.conf.d && printf '[Resolve]\nDNS=185.12.64.1 185.12.64.2\n' > /etc/systemd/resolved.conf.d/hetzner.conf && systemctl restart systemd-resolved
runcmd:
  # Rust toolchain for building on the box.
  - curl -sSf https://sh.rustup.rs | HOME=/root sh -s -- -y --profile minimal
  - ufw allow OpenSSH && ufw allow from 10.0.0.0/16 to any port 8770 proto tcp && ufw --force enable
  - install -d -o root -g docs-mcp -m 0750 /etc/docs-mcp
  - install -d -o docs-mcp -g docs-mcp -m 0700 /var/lib/docs-mcp /var/lib/docs-mcp/docs
