[package]
name = "docs-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
hex = "0.4.3"
htmd = "0.5.5"
libc = "0.2.190"
rand = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.4.1", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
